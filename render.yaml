services:
  - type: web
    name: smart-dollar-watcher
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUTF8
        value: "1"
      - key: TZ
        value: "America/Sao_Paulo"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-dollar-db
          property: connectionString

databases:
  - name: smart-dollar-db
    databaseName: smart_dollar
    user: smart_dollar_user
    plan: free
